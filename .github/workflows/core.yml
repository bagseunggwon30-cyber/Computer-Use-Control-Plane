name: CUCP core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/pi/package-lock.json
      - run: python -m unittest discover -s tests/python -v
        env:
          PYTHONPATH: pcucp-next/python
      - run: npm ci --ignore-scripts
        working-directory: integrations/pi
      - run: npm run typecheck && npm test && npm run test:engine
        working-directory: integrations/pi
  windows-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - id: build_native
        run: dotnet build pcucp-next/dotnet/PcuCp.NativeHost/PcuCp.NativeHost.csproj -c Release
      - run: dotnet run --project pcucp-next/dotnet/PcuCp.NativeHost.ContractTests -c Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Unicode and argv qualification (no actual install)
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path (Get-Location).Path 'pcucp-next/python'
          python -m unittest discover -s tests/python -p test_install_runtime.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native resident transport (no desktop input)
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path (Get-Location).Path 'pcucp-next/python'
          $env:CUCP_NATIVE_TEST_HOST = (Resolve-Path 'pcucp-next/dotnet/PcuCp.NativeHost/bin/Release/net8.0-windows10.0.19041.0/PcuCp.NativeHost.dll').Path
          python -m unittest discover -s tests/python -p test_native_session.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Legacy OCR pure algorithm and bridge differential
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:CUCP_NATIVE_TEST_HOST = (Resolve-Path 'pcucp-next/dotnet/PcuCp.NativeHost/bin/Release/net8.0-windows10.0.19041.0/PcuCp.NativeHost.dll').Path
          python -m unittest discover -s tests/python -p test_legacy_ocr_parity.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Legacy safety confirmation-policy differential
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project pcucp-next/dotnet/PcuCp.LegacyPure.ContractTests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CUCP_NATIVE_TEST_HOST = (Resolve-Path 'pcucp-next/dotnet/PcuCp.NativeHost/bin/Release/net8.0-windows10.0.19041.0/PcuCp.NativeHost.dll').Path
          python -m unittest discover -s tests/python -p test_legacy_safety_parity.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Legacy coordinate mapping differential (captured fixture inputs)
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:CUCP_NATIVE_TEST_HOST = (Resolve-Path 'pcucp-next/dotnet/PcuCp.NativeHost/bin/Release/net8.0-windows10.0.19041.0/PcuCp.NativeHost.dll').Path
          python -m unittest discover -s tests/python -p test_legacy_coordinate_parity.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Legacy strategy ranking differential (captured fixture inputs)
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:CUCP_NATIVE_TEST_HOST = (Resolve-Path 'pcucp-next/dotnet/PcuCp.NativeHost/bin/Release/net8.0-windows10.0.19041.0/PcuCp.NativeHost.dll').Path
          python -m unittest discover -s tests/python -p test_legacy_strategy_parity.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Workflow exact parsed-plan and candidate qualification (parser retained)
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' }}
        shell: pwsh
        run: |
          $env:CUCP_NATIVE_TEST_HOST = (Resolve-Path 'pcucp-next/dotnet/PcuCp.NativeHost/bin/Release/net8.0-windows10.0.19041.0/PcuCp.NativeHost.dll').Path
          python -m unittest discover -s tests/python -p test_legacy_workflow_parity.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Legacy task preset recipe qualification (captured child plans)
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project pcucp-next/dotnet/PcuCp.LegacyTaskPreset.ContractTests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CUCP_NATIVE_TEST_HOST = (Resolve-Path 'pcucp-next/dotnet/PcuCp.NativeHost/bin/Release/net8.0-windows10.0.19041.0/PcuCp.NativeHost.dll').Path
          python -m unittest discover -s tests/python -p test_legacy_task_preset_parity.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Task and form planning qualification (captured child replies)
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project pcucp-next/dotnet/PcuCp.LegacyTaskForm.ContractTests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/python -p test_legacy_task_form_parity.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smart-plan qualification (captured read-only probes)
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project pcucp-next/dotnet/PcuCp.LegacySmartPlan.ContractTests -c Release -- --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/python -p test_legacy_smart_plan_parity.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compiled legacy interop API and ABI qualification
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' }}
        shell: pwsh
        run: |
          python pcucp-next/packaging/publish_legacy_interop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CUCP_LEGACY_INTEROP_TEST_DLL = (Resolve-Path 'pcucp-next/bin/legacy/PcuCp.LegacyInterop.dll').Path
          python -m unittest discover -s tests/python -p test_legacy_interop.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Legacy image decoder and pixel-diff qualification (generated files only)
        if: ${{ !cancelled() && steps.build_native.outcome == 'success' }}
        shell: pwsh
        run: |
          python pcucp-next/packaging/publish_legacy_images.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CUCP_LEGACY_IMAGES_TEST_DLL = (Resolve-Path 'pcucp-next/bin/legacy/PcuCp.LegacyImages.dll').Path
          python -m unittest discover -s tests/python -p test_legacy_images.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - shell: pwsh
        run: |
          $env:CUCP_NATIVE_HOST = (Resolve-Path 'pcucp-next/dotnet/PcuCp.NativeHost/bin/Release/net8.0-windows10.0.19041.0/PcuCp.NativeHost.dll').Path
          Import-Module Pester -MinimumVersion 5.0 -ErrorAction Stop
          Invoke-Pester -Path tests/cucp.LegacyRegression.Tests.ps1 -CI
      # No interactive desktop input tests on hosted runners. See manual Windows checks.
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r pcucp-next/packaging/requirements-build.txt
      - name: Build and verify relocated portable bundle
        run: python pcucp-next/packaging/build_portable.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/pi/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: integrations/pi
      - name: Pi adapter with packaged engine and no Python on child PATH
        shell: pwsh
        run: |
          $env:CUCP_EXECUTABLE = (Resolve-Path '../../dist/CUCP-0.4.0-win-x64/CUCP.exe').Path
          $node = (Get-Command node).Source
          $env:PATH = Join-Path $env:SystemRoot 'System32'
          & $node --import tsx test/engine-smoke.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        working-directory: integrations/pi
      - uses: actions/upload-artifact@v4
        with:
          name: CUCP-0.4.0-win-x64
          path: |
            dist/CUCP-0.4.0-win-x64.zip
            dist/CUCP-0.4.0-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
  browser-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fresh-profile headless browser protocol fixtures
        run: python -m unittest discover -s tests/python -p test_cdp_browser.py -v
        env:
          PYTHONPATH: pcucp-next/python
          CUCP_CHROME_TEST: '1'
