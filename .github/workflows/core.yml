name: CUCP core
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  PYTHONUTF8: '1'
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/pi/package-lock.json
      - run: python -m unittest discover -s tests/python -v
        env:
          PYTHONPATH: pcucp-next/python
      - run: npm ci --ignore-scripts
        working-directory: integrations/pi
      - run: npm run typecheck && npm test && npm run test:engine
        working-directory: integrations/pi
  windows-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build pcucp-next/dotnet/PcuCp.NativeHost/PcuCp.NativeHost.csproj -c Release
      - run: dotnet run --project pcucp-next/dotnet/PcuCp.NativeHost.ContractTests -c Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python and real resident transport (no desktop input)
        run: python -m unittest discover -s tests/python -v
        env:
          PYTHONPATH: pcucp-next/python
          CUCP_NATIVE_TEST_HOST: ${{ github.workspace }}/pcucp-next/dotnet/PcuCp.NativeHost/bin/Release/net8.0-windows10.0.19041.0/PcuCp.NativeHost.dll
      # No interactive desktop input tests on hosted runners. See manual Windows checks.
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m pip install -r pcucp-next/packaging/requirements-build.txt
      - name: Build and verify relocated portable bundle
        run: python pcucp-next/packaging/build_portable.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/pi/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: integrations/pi
      - name: Pi adapter with packaged engine and no Python on child PATH
        run: python pcucp-next/packaging/verify_pi_portable.py --bundle dist/CUCP-0.5.0-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: CUCP-0.5.0-win-x64
          path: |
            dist/CUCP-0.5.0-win-x64.zip
            dist/CUCP-0.5.0-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
  browser-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fresh-profile browser protocol fixtures
        run: python -m unittest discover -s tests/python -p test_cdp_browser.py -v
        env:
          PYTHONPATH: pcucp-next/python
          CUCP_CHROME_TEST: '1'
