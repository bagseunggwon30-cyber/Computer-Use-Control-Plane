name: CUCP core
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/pi/package-lock.json
      - run: python -m unittest discover -s tests/python -v
        env:
          PYTHONPATH: pcucp-next/python
      - run: npm ci --ignore-scripts
        working-directory: integrations/pi
      - run: npm run typecheck && npm test && npm run test:engine
        working-directory: integrations/pi
  windows-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build pcucp-next/dotnet/PcuCp.NativeHost/PcuCp.NativeHost.csproj -c Release
      - run: dotnet run --project pcucp-next/dotnet/PcuCp.NativeHost.ContractTests -c Release
      - shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 4.10.1 -Force -Scope CurrentUser
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          Invoke-Pester -Script tests/cucp.LegacyRegression.Tests.ps1 -EnableExit
      # No interactive desktop input tests on hosted runners. See manual Windows checks.
