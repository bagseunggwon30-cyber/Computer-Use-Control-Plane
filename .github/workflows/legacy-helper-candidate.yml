name: Legacy helper candidate only
on:
  workflow_dispatch:
  push:
    branches: [migration/python-csharp-runtime]
    paths:
      - 'pcucp-next/dotnet/PcuCp.LegacyHelper*/**'
      - 'pcucp-next/python/pcucp_cli/legacy_helper_client.py'
      - 'pcucp-next/packaging/qualify_legacy_helper.py'
      - 'tests/fixtures/legacy-helper*/**'
      - 'tests/fixtures/legacy-helper*.ps1'
      - 'tests/python/*helper*.py'
      - '.github/workflows/legacy-helper-candidate.yml'
permissions:
  contents: read
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Portable contracts and failure evidence
        if: runner.os != 'Windows'
        run: python pcucp-next/packaging/qualify_legacy_helper.py --log-dir .migration-logs/helper-candidate
      - name: Owned Windows pipe and exact published oracle
        if: runner.os == 'Windows'
        run: python pcucp-next/packaging/qualify_legacy_helper.py --windows --log-dir .migration-logs/helper-candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-helper-candidate-${{ runner.os }}
          path: .migration-logs/helper-candidate
          include-hidden-files: true
          retention-days: 7
