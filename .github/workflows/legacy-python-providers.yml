name: Preserved Python diagnostic providers
on:
  workflow_dispatch:
  push:
    branches: [codex/preserve-features-python-runtime, codex/python-runtime-retirement]
  pull_request:
    paths:
      - 'pcucp-next/python/pcucp_cli/legacy_*.py'
      - 'pcucp-next/dotnet/PcuCp.NativeHost/**'
      - 'pcucp-next/dotnet/PcuCp.LegacyDesktop/**'
      - 'pcucp-next/dotnet/PcuCp.LegacySyntax/**'
      - 'pcucp-next/dotnet/PcuCp.LegacyInterop.Net8/**'
      - 'tests/python/test_legacy_diagnostic_provider.py'
      - 'tests/python/test_legacy_diagnostic_runtime.py'
      - 'tests/python/test_legacy_native_desktop.py'
      - 'tests/python/test_legacy_native_entry.py'
      - 'tests/python/test_start_pi.py'
      - 'install.py'
      - 'scripts/cucp-native-helper.py'
      - 'pcucp-next/packaging/start_pi.py'
      - 'scripts/cucp.ps1'
      - 'scripts/cucp-legacy-cdp-adapter.ps1'
      - 'scripts/cucp-helper-server.py'
      - 'scripts/cucp-staged-helper-adapter.ps1'
      - 'pcucp-next/dotnet/PcuCp.LegacyHelper/**'
      - 'tests/python/test_python_helper_server.py'
      - 'tests/python/test_python_helper_production.py'
      - 'tests/python/test_legacy_default_autostart.py'
      - 'tests/python/test_legacy_helper_autostart.py'
      - 'pcucp-next/python/legacy_helper_autostart*.py'
      - 'tests/python/test_legacy_execution_runtime.py'
      - 'tests/python/test_legacy_native_macros.py'
      - 'tests/python/test_legacy_coordinates_runtime.py'
      - 'tests/python/test_legacy_preserved_owner.py'
      - 'tests/python/test_legacy_precision_runtime.py'
      - 'tests/python/test_legacy_interaction_runtime.py'
      - 'tests/python/test_legacy_syntax_runtime.py'
      - '.github/workflows/legacy-python-providers.yml'
permissions:
  contents: read
jobs:
  windows-providers:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build actual Windows coordinator and acquisition worker
        run: dotnet build pcucp-next/dotnet/PcuCp.NativeHost/PcuCp.NativeHost.csproj -c Release --nologo
      - name: Build retained Framework desktop backend
        run: dotnet build pcucp-next/dotnet/PcuCp.LegacyDesktop/PcuCp.LegacyDesktop.csproj -c Release -warnaserror --nologo
      - name: Build read-only Windows workflow syntax compatibility
        run: dotnet build pcucp-next/dotnet/PcuCp.LegacySyntax/PcuCp.LegacySyntax.csproj -c Release -warnaserror --nologo
      - name: Generate owned OCR fixtures
        run: python -m pip install Pillow
      - name: Publish compiled read-only pipe helper
        run: python pcucp-next/packaging/publish_legacy_helper.py
      - name: Qualify Python files, Node argv, native reads and shared deadlines
        shell: bash
        env:
          PYTHONPATH: 'pcucp-next/python;tests/python'
          PYTHONIOENCODING: utf-8
        run: |
          export CUCP_DIAGNOSTIC_PROVIDER_NATIVE="$(cygpath -w "$GITHUB_WORKSPACE/pcucp-next/dotnet/PcuCp.NativeHost/bin/Release/net8.0-windows10.0.19041.0/PcuCp.NativeHost.dll")"
          export CUCP_LEGACY_DESKTOP_EXE="$(cygpath -w "$GITHUB_WORKSPACE/pcucp-next/dotnet/PcuCp.LegacyDesktop/bin/Release/net48/PcuCp.LegacyDesktop.exe")"
          export CUCP_LEGACY_SYNTAX_EXE="$(cygpath -w "$GITHUB_WORKSPACE/pcucp-next/dotnet/PcuCp.LegacySyntax/bin/Release/net48/PcuCp.LegacySyntax.exe")"
          export CUCP_NATIVE_HOST="$CUCP_DIAGNOSTIC_PROVIDER_NATIVE"
          export CUCP_PYTHON_HELPER_PACKAGE="$(cygpath -w "$GITHUB_WORKSPACE/pcucp-next/bin/legacy-helper")"
          export CUCP_REQUIRE_PYTHON_HELPER_PRODUCTION=1
          export CUCP_REQUIRE_STAGED_AUTOSTART=1
          export CUCP_SOURCE_MAP_TEST_EXE="$CUCP_LEGACY_SYNTAX_EXE"
          export CUCP_REQUIRE_LEGACY_FAST_SMOKE=1
          python -m unittest test_source_map test_legacy_fast_smoke -v
          python -m unittest test_legacy_default_autostart test_legacy_helper_autostart -v
          python -m unittest test_python_helper_server test_python_helper_production -v
          python -m unittest test_start_pi test_install_runtime test_legacy_native_entry test_legacy_native_retirement test_legacy_diagnostic_runtime test_legacy_diagnostic_provider test_legacy_native_desktop test_legacy_native_macros test_legacy_coordinates_runtime test_legacy_preserved_owner test_legacy_precision_runtime test_legacy_interaction_runtime test_legacy_execution_runtime test_legacy_syntax_runtime test_legacy_host_protocol test_native_session test_legacy_dispatch_contract test_legacy_dispatch_refresh -v
