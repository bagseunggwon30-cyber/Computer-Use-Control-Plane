[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cucp-core"
version = "0.2.0"
description = "Local Windows computer-use execution engine for agent hosts"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cucp = "pcucp_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pcucp_cli*"]
